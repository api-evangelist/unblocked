apis:
- aid: unblocked:unblocked-answers-api
  name: Unblocked Answers API
  description: >-
    Ask Unblocked questions and retrieve answers asynchronously. Submit a question using the PUT endpoint
    and poll for the response using the GET endpoint.
  humanURL: https://docs.getunblocked.com/api-reference/quickstart
  baseURL: https://getunblocked.com/api/v1
  tags:
  - Answers
  properties:
  - type: OpenAPI
    url: openapi/unblocked-answers-api-openapi.yml
  - type: Documentation
    url: https://docs.getunblocked.com/api-reference/quickstart
- aid: unblocked:unblocked-collections-api
  name: Unblocked Collections API
  description: >-
    A collection in Unblocked allows you to organize related documents from various data sources, such
    as customer support tools, knowledge bases, and internal wikis, which are not natively supported by
    Unblocked.


    You can create multiple collections to manage documents from different sources.


    You have the ability to list, create, update, and delete them as needed.


    Deleting a collection will also remove all the associated documents.
  humanURL: https://docs.getunblocked.com/api-reference/quickstart
  baseURL: https://getunblocked.com/api/v1
  tags:
  - Collection
  tags_raw:
  - Collections
  properties:
  - type: OpenAPI
    url: openapi/unblocked-collections-api-openapi.yml
  - type: Documentation
    url: https://docs.getunblocked.com/api-reference/quickstart
- aid: unblocked:unblocked-documents-api
  name: Unblocked Documents API
  description: >-
    A document contains content that Unblocked uses to answer questions. Each document is associated with
    a collection, so you must create a collection before adding documents. Documents used to provide answers
    will appear as references in the Unblocked interface.


    You can create and delete documents as needed.
  humanURL: https://docs.getunblocked.com/api-reference/quickstart
  baseURL: https://getunblocked.com/api/v1
  tags:
  - Documents
  properties:
  - type: OpenAPI
    url: openapi/unblocked-documents-api-openapi.yml
  - type: Documentation
    url: https://docs.getunblocked.com/api-reference/quickstart
