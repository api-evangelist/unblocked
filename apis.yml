aid: unblocked
name: Unblocked
description: 'Unblocked is an AI context engine for engineering teams that consolidates
  code, documentation, tickets, and conversations from sources like GitHub, Slack,
  Jira, Confluence, Notion, and Google Drive into grounded, cited answers for
  engineers and AI coding agents. The product spans developer Q&A, AI code review
  with risk assessment, a CI failure agent, an official MCP server (local via the
  Unblocked CLI and hosted remote), open-source Agent Skills, and a Public API for
  ingesting custom documents and asking questions programmatically. Built by Next
  Chapter Software Inc and backed by Amplify Partners.'
